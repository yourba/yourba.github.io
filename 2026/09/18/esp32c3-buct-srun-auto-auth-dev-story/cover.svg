<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="ESP32-C3 开发板与路由器">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9fbfd"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="400" rx="18" fill="url(#bg)"/>

  <!-- 桌面 -->
  <rect x="40" y="286" width="720" height="8" rx="4" fill="#e2e8f0"/>

  <!-- 路由器 -->
  <g>
    <line x1="128" y1="118" x2="104" y2="72" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="222" y1="118" x2="248" y2="72" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <rect x="96" y="118" width="176" height="96" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="112" y="136" width="144" height="30" rx="6" fill="#f1f5f9"/>
    <circle cx="130" cy="151" r="4" fill="#22c55e"/>
    <circle cx="146" cy="151" r="4" fill="#22c55e"/>
    <circle cx="162" cy="151" r="4" fill="#cbd5e1"/>
    <text x="184" y="156" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#94a3b8">miwifi</text>
    <rect x="112" y="176" width="144" height="22" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="126" y="191" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#94a3b8">WAN / LAN</text>
    <text x="184" y="240" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">路由器（NAT）</text>
  </g>

  <!-- WiFi 波纹 -->
  <g stroke="#2563eb" fill="none" stroke-linecap="round">
    <path d="M300 168 q26 -22 52 0" stroke-width="3" opacity="0.35"/>
    <path d="M308 158 q34 -30 68 0" stroke-width="3" opacity="0.28"/>
    <path d="M316 148 q42 -38 84 0" stroke-width="3" opacity="0.2"/>
  </g>

  <!-- ESP32-C3 小板子 -->
  <g>
    <rect x="430" y="122" width="176" height="88" rx="10" fill="#1e2937"/>
    <g fill="#c98f34">
      <rect x="444" y="112" width="14" height="12" rx="2"/>
      <rect x="468" y="112" width="14" height="12" rx="2"/>
      <rect x="492" y="112" width="14" height="12" rx="2"/>
      <rect x="516" y="112" width="14" height="12" rx="2"/>
      <rect x="540" y="112" width="14" height="12" rx="2"/>
      <rect x="564" y="112" width="14" height="12" rx="2"/>
      <rect x="444" y="208" width="14" height="12" rx="2"/>
      <rect x="468" y="208" width="14" height="12" rx="2"/>
      <rect x="492" y="208" width="14" height="12" rx="2"/>
      <rect x="516" y="208" width="14" height="12" rx="2"/>
      <rect x="540" y="208" width="14" height="12" rx="2"/>
      <rect x="564" y="208" width="14" height="12" rx="2"/>
    </g>
    <rect x="470" y="142" width="96" height="48" rx="6" fill="#0b1220"/>
    <text x="518" y="166" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e2e8f0">ESP32-C3</text>
    <text x="518" y="182" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8">2 MB flash</text>
    <circle cx="446" cy="176" r="7" fill="#3b82f6" filter="url(#glow)"/>
    <circle cx="446" cy="176" r="12" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.35"/>
    <text x="518" y="240" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">认证代理</text>
    <!-- USB 线 -->
    <path d="M606 200 q52 26 60 76" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <rect x="656" y="272" width="42" height="18" rx="5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="677" y="306" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#94a3b8">5V USB</text>
  </g>

  <text x="400" y="348" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#334155">十几块钱的小板子，负责替整台路由器登录校园网</text>
  <text x="400" y="372" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#94a3b8">它只是普通地连上 WiFi，路由器完全不用改配置</text>
</svg>
