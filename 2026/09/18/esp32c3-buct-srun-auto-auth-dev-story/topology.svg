<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420" role="img" aria-label="认证拓扑：校园网门户、路由器与局域网设备">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9fbfd"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="840" height="420" rx="18" fill="url(#bg2)"/>

  <!-- 校园网门户 -->
  <g>
    <rect x="40" y="70" width="196" height="104" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="60" y="90" width="156" height="34" rx="8" fill="#eff6ff"/>
    <text x="138" y="112" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1d4ed8">tree.buct.edu.cn</text>
    <text x="138" y="146" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#334155">深澜 Srun 认证</text>
    <text x="138" y="166" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#94a3b8">未认证时把请求劫持到门户页</text>
    <text x="138" y="200" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#64748b">校园网</text>
  </g>

  <!-- 路由器 -->
  <g>
    <rect x="322" y="70" width="180" height="104" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="340" y="88" width="144" height="28" rx="6" fill="#f1f5f9"/>
    <circle cx="356" cy="102" r="4" fill="#22c55e"/>
    <circle cx="370" cy="102" r="4" fill="#22c55e"/>
    <text x="412" y="107" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#94a3b8">NAT</text>
    <text x="412" y="136" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#334155">路由器</text>
    <rect x="340" y="146" width="144" height="20" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="412" y="160" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#64748b">WAN：校园网只看到这一个 IP</text>
    <text x="412" y="200" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#64748b">宿舍局域网</text>
  </g>

  <!-- 设备群 -->
  <g>
    <rect x="640" y="78" width="52" height="86" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="650" y="88" width="32" height="58" rx="4" fill="#f1f5f9"/>
    <circle cx="666" cy="155" r="4" fill="#cbd5e1"/>

    <rect x="706" y="92" width="94" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="722" y="104" width="62" height="36" rx="4" fill="#f1f5f9"/>
    <rect x="712" y="152" width="82" height="8" rx="4" fill="#e2e8f0"/>

    <rect x="640" y="184" width="160" height="26" rx="8" fill="none" stroke="#e2e8f0"/>
    <text x="720" y="202" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#94a3b8">手机 · 电脑 · 平板：什么都不用装</text>
  </g>

  <!-- ESP32-C3 -->
  <g>
    <rect x="352" y="278" width="150" height="72" rx="10" fill="#1e2937"/>
    <text x="427" y="308" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e2e8f0">ESP32-C3</text>
    <text x="427" y="326" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#94a3b8">30 秒探测一次</text>
    <circle cx="368" cy="322" r="6" fill="#3b82f6"/>
    <text x="427" y="372" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#475569">以普通 STA 身份连 WiFi</text>
  </g>

  <!-- 连线 -->
  <line x1="236" y1="122" x2="318" y2="122" stroke="#2563eb" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="277" y="112" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#2563eb">WAN</text>

  <line x1="502" y1="122" x2="634" y2="122" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="568" y="112" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#64748b">DHCP</text>

  <path d="M427 278 q0 -46 -105 -52" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="352" y="252" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#2563eb">模拟浏览器登录</text>

  <path d="M138 190 q0 130 214 130" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="248" y="344" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#b45309">认证按 IP 生效：这一个 IP 通了，全宿舍一起上线</text>
</svg>
