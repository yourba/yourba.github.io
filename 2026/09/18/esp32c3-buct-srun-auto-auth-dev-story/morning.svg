<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="清晨来电后设备自动认证">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="glow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="360" rx="18" fill="url(#bg6)"/>

  <rect x="60" y="46" width="180" height="150" rx="10" fill="url(#sky)" stroke="#fdba74" stroke-width="2"/>
  <circle cx="118" cy="96" r="22" fill="#fbbf24"/>
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="118" y1="128" x2="118" y2="146"/>
    <line x1="150" y1="104" x2="166" y2="112"/>
    <line x1="86" y1="104" x2="70" y2="112"/>
  </g>
  <path d="M96 196 q26 -34 52 0 q26 -22 52 0" fill="none" stroke="#fb923c" stroke-width="3" opacity="0.6"/>
  <text x="150" y="228" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#b45309">4:30 来电</text>

  <!-- 时钟 -->
  <circle cx="700" cy="96" r="46" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="700" y1="96" x2="700" y2="68" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="700" y1="96" x2="726" y2="106" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <circle cx="700" cy="96" r="3.5" fill="#334155"/>
  <text x="700" y="164" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#64748b">宿舍供电恢复</text>

  <!-- 路由器 + 板子 -->
  <rect x="300" y="176" width="176" height="94" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="318" y="192" width="140" height="28" rx="6" fill="#f1f5f9"/>
  <circle cx="334" cy="206" r="4" fill="#22c55e"/>
  <circle cx="348" cy="206" r="4" fill="#22c55e"/>
  <text x="388" y="240" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#334155">路由器</text>
  <text x="388" y="258" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#94a3b8">NAT</text>

  <rect x="516" y="186" width="120" height="62" rx="9" fill="#1e2937"/>
  <text x="576" y="212" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e2e8f0">ESP32-C3</text>
  <circle cx="534" cy="228" r="6" fill="#3b82f6" filter="url(#glow2)"/>
  <path d="M476 218 q20 -8 40 0" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  <text x="576" y="272" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#64748b">上电即认证</text>

  <text x="400" y="316" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#334155">断电就是最好的定时器</text>
  <text x="400" y="340" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#64748b">来电上电，固件自动走完 连 WiFi → 探测 → 认证，全天守着</text>
</svg>
