<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 0 780 520" role="img" aria-labelledby="title desc"><title id="title">朗肯循环的 T-s 图</title><desc id="desc">水蒸气朗肯循环：锅炉定压吸热、汽轮机绝热膨胀、凝汽器定压放热、水泵绝热压缩。</desc><defs><marker id="axis" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#243c48"/></marker><marker id="flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#c76b4a"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="40" y="42" font-size="26" fill="#243c48" text-anchor="start" font-weight="600">朗肯循环：T-s 图</text><text x="40" y="70" font-size="16" fill="#627681" text-anchor="start" font-weight="400">示意，不按比例；水蒸气表才是计算依据。</text><path d="M80,460 L740,460" fill="none" stroke="#243c48" stroke-width="2" marker-end="url(#axis)"/><path d="M80,460 L80,60" fill="none" stroke="#243c48" stroke-width="2" marker-end="url(#axis)"/><text x="720" y="492" font-size="20" fill="#243c48" text-anchor="end" font-weight="600">s</text><text x="52" y="104" font-size="20" fill="#243c48" text-anchor="middle" font-weight="600">T</text><path d="M170,460 C200,300 280,190 400,160 C520,190 600,300 650,460" fill="none" stroke="#74928a" stroke-width="2.5"/><text x="624" y="420" font-size="15" fill="#627681" text-anchor="start">饱和汽线</text><text x="142" y="420" font-size="15" fill="#627681" text-anchor="end">饱和液线</text><circle cx="400" cy="160" r="4" fill="#243c48"/><text x="410" y="152" font-size="15" fill="#243c48" text-anchor="start">临界点</text><path d="M210,415 C230,300 300,200 400,160 C470,135 520,128 560,120" fill="none" stroke="#c76b4a" stroke-width="3"/><path d="M560,120 L560,430" fill="none" stroke="#c76b4a" stroke-width="3" marker-end="url(#flow)"/><path d="M560,430 L210,430" fill="none" stroke="#c76b4a" stroke-width="3" marker-end="url(#flow)"/><path d="M210,430 L210,415" fill="none" stroke="#c76b4a" stroke-width="3" marker-end="url(#flow)"/><path d="M210,430 L740,430" fill="none" stroke="#9aaeb6" stroke-width="1.5" stroke-dasharray="6 6"/><text x="700" y="450" font-size="15" fill="#627681" text-anchor="end">p₂ = 0.005 MPa</text><text x="446" y="110" font-size="15" fill="#627681" text-anchor="start">p₁ = 3 MPa，420℃</text><circle cx="560" cy="120" r="6" fill="#ffffff" stroke="#c76b4a" stroke-width="3"/><text x="574" y="116" font-size="19" fill="#243c48" text-anchor="start" font-weight="600">1</text><circle cx="560" cy="430" r="6" fill="#ffffff" stroke="#c76b4a" stroke-width="3"/><text x="574" y="426" font-size="19" fill="#243c48" text-anchor="start" font-weight="600">2</text><circle cx="210" cy="430" r="6" fill="#ffffff" stroke="#c76b4a" stroke-width="3"/><text x="190" y="450" font-size="19" fill="#243c48" text-anchor="end" font-weight="600">3</text><circle cx="210" cy="415" r="6" fill="#ffffff" stroke="#c76b4a" stroke-width="3"/><text x="190" y="410" font-size="19" fill="#243c48" text-anchor="end" font-weight="600">4</text><path d="M210,415 L211,416" fill="none" stroke="#c76b4a" stroke-width="3"/><text x="330" y="360" font-size="16" fill="#c76b4a" text-anchor="start">4→1 锅炉定压吸热</text><text x="572" y="250" font-size="16" fill="#c76b4a" text-anchor="start">1→2 汽轮机绝热膨胀</text><text x="330" y="414" font-size="16" fill="#c76b4a" text-anchor="start">2→3 凝汽器定压放热</text><text x="218" y="400" font-size="16" fill="#c76b4a" text-anchor="start">3→4 水泵绝热压缩</text><text x="40" y="500" font-size="15" fill="#627681" text-anchor="start" font-weight="400">效率 η = (h₁ − h₂ − w_pump) / (h₁ − h₄)，泵功通常只占 0.8%~1%。</text></g></svg>
