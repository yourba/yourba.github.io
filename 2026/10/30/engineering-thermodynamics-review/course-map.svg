<svg xmlns="http://www.w3.org/2000/svg" width="780" height="625" viewBox="0 0 780 625" role="img" aria-labelledby="title desc"><title id="title">工程热力学的四个问题</title><desc id="desc">从描述状态、记录能量、判断方向到接成循环，九章内容围绕四个问题展开。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#74928a"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="32" y="42" font-size="27" fill="#243c48" text-anchor="start" font-weight="600">工程热力学的四个问题</text><text x="32" y="72" font-size="17" fill="#627681" text-anchor="start" font-weight="400">九章内容不是并列的，而是一条从状态到循环的主线。</text><rect x="32" y="96" width="470" height="92" rx="12" fill="#eef5f3" stroke="#afc8be"/><text x="54" y="130" font-size="18" fill="#277e67" text-anchor="start" font-weight="400">01</text><text x="99" y="130" font-size="23" fill="#243c48" text-anchor="start" font-weight="600">怎么描述状态</text><text x="99" y="161" font-size="17" fill="#243c48" text-anchor="start" font-weight="400">系统 · 状态参数 · 理想气体 · 水蒸气 · 湿空气</text><path d="M267,188 L267,215" fill="none" stroke="#74928a" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="217" width="470" height="92" rx="12" fill="#eef5f3" stroke="#afc8be"/><text x="54" y="251" font-size="18" fill="#277e67" text-anchor="start" font-weight="400">02</text><text x="99" y="251" font-size="23" fill="#243c48" text-anchor="start" font-weight="600">能量怎么记账</text><text x="99" y="282" font-size="17" fill="#243c48" text-anchor="start" font-weight="400">闭口系 · 开口系 · 稳流 · 焓 · 四种功</text><path d="M267,309 L267,336" fill="none" stroke="#74928a" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="338" width="470" height="92" rx="12" fill="#eef5f3" stroke="#afc8be"/><text x="54" y="372" font-size="18" fill="#277e67" text-anchor="start" font-weight="400">03</text><text x="99" y="372" font-size="23" fill="#243c48" text-anchor="start" font-weight="600">过程往哪走</text><text x="99" y="403" font-size="17" fill="#243c48" text-anchor="start" font-weight="400">第二定律 · 卡诺 · 熵 · 熵产 · 㶲</text><path d="M267,430 L267,457" fill="none" stroke="#74928a" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="459" width="470" height="92" rx="12" fill="#eef5f3" stroke="#afc8be"/><text x="54" y="493" font-size="18" fill="#277e67" text-anchor="start" font-weight="400">04</text><text x="99" y="493" font-size="23" fill="#243c48" text-anchor="start" font-weight="600">怎么接成循环</text><text x="99" y="524" font-size="17" fill="#243c48" text-anchor="start" font-weight="400">内燃机 · 燃气轮机 · 朗肯 · 制冷</text><path d="M520,120 L557,120" fill="none" stroke="#74928a" stroke-width="2" marker-end="url(#arrow)"/><text x="576" y="112" font-size="20" fill="#243c48" text-anchor="start" font-weight="600">要算什么</text><text x="576" y="140" font-size="16" fill="#243c48" text-anchor="start" font-weight="400">p、v、T、u、h、s</text><path d="M520,238 L557,238" fill="none" stroke="#74928a" stroke-width="2" marker-end="url(#arrow)"/><text x="576" y="230" font-size="20" fill="#243c48" text-anchor="start" font-weight="600">Q、W、ΔU、ΔH</text><text x="576" y="258" font-size="16" fill="#243c48" text-anchor="start" font-weight="400">先选系统，再找边界</text><path d="M520,356 L557,356" fill="none" stroke="#74928a" stroke-width="2" marker-end="url(#arrow)"/><text x="576" y="348" font-size="20" fill="#243c48" text-anchor="start" font-weight="600">η、ε、S<tspan font-size="14">g</tspan>、I</text><text x="576" y="376" font-size="16" fill="#243c48" text-anchor="start" font-weight="400">能不能发生，损失多少</text><path d="M520,474 L557,474" fill="none" stroke="#74928a" stroke-width="2" marker-end="url(#arrow)"/><text x="576" y="466" font-size="20" fill="#243c48" text-anchor="start" font-weight="600">循环净功、效率</text><text x="576" y="494" font-size="16" fill="#243c48" text-anchor="start" font-weight="400">升压 · 加热 · 作功 · 放热</text><rect x="32" y="576" width="716" height="30" rx="8" fill="#f6f8f7"/><text x="46" y="597" font-size="16" fill="#627681" text-anchor="start" font-weight="400">每道题先问三件事：闭口还是开口？可逆还是不可逆？工质是不是理想气体？</text></g></svg>
