<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 0 780 520" role="img" aria-labelledby="title desc"><title id="title">湿空气的 h-d 图</title><desc id="desc">湿空气加热、冷却到露点、继续冷却去湿的过程示意。</desc><defs><marker id="axis" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#243c48"/></marker><marker id="flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#c76b4a"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="40" y="42" font-size="26" fill="#243c48" text-anchor="start" font-weight="600">湿空气的 h-d 图（示意）</text><text x="40" y="70" font-size="16" fill="#627681" text-anchor="start" font-weight="400">等温线、等相对湿度线只画了示意，实际查图要按总压修正。</text><path d="M80,450 L740,450" fill="none" stroke="#243c48" stroke-width="2" marker-end="url(#axis)"/><path d="M80,450 L80,70" fill="none" stroke="#243c48" stroke-width="2" marker-end="url(#axis)"/><text x="720" y="482" font-size="20" fill="#243c48" text-anchor="end" font-weight="600">d</text><text x="54" y="88" font-size="20" fill="#243c48" text-anchor="middle" font-weight="600">h</text><text x="730" y="470" font-size="14" fill="#627681" text-anchor="end">kg/kg 干空气</text><text x="92" y="88" font-size="14" fill="#627681" text-anchor="start">kJ/kg 干空气</text><path d="M120,430 C260,410 420,340 560,240 C610,205 650,175 680,156" fill="none" stroke="#4c8b78" stroke-width="2.5"/><text x="600" y="196" font-size="15" fill="#4c8b78" text-anchor="start">φ = 100%（饱和线）</text><path d="M120,370 C260,350 420,280 560,180 C610,145 650,115 680,96" fill="none" stroke="#8fb3a8" stroke-width="2" stroke-dasharray="6 5"/><text x="600" y="138" font-size="15" fill="#7a9a90" text-anchor="start">φ = 60%</text><path d="M300,330 L300,220" fill="none" stroke="#c76b4a" stroke-width="3" marker-end="url(#flow)"/><path d="M300,330 L300,386" fill="none" stroke="#c76b4a" stroke-width="3" marker-end="url(#flow)"/><path d="M300,386 C270,392 250,400 235,408" fill="none" stroke="#c76b4a" stroke-width="3" marker-end="url(#flow)"/><circle cx="300" cy="330" r="6" fill="#ffffff" stroke="#c76b4a" stroke-width="3"/><text x="312" y="326" font-size="18" fill="#243c48" text-anchor="start" font-weight="600">1</text><text x="312" y="350" font-size="15" fill="#627681" text-anchor="start">30℃、60%</text><circle cx="300" cy="220" r="6" fill="#ffffff" stroke="#c76b4a" stroke-width="3"/><text x="312" y="216" font-size="18" fill="#243c48" text-anchor="start" font-weight="600">2</text><text x="312" y="240" font-size="15" fill="#627681" text-anchor="start">加热到 50℃</text><circle cx="300" cy="386" r="6" fill="#ffffff" stroke="#c76b4a" stroke-width="3"/><text x="282" y="404" font-size="18" fill="#243c48" text-anchor="end" font-weight="600">3</text><text x="282" y="382" font-size="15" fill="#627681" text-anchor="end">露点 21.4℃</text><circle cx="235" cy="408" r="6" fill="#ffffff" stroke="#c76b4a" stroke-width="3"/><text x="218" y="428" font-size="18" fill="#243c48" text-anchor="end" font-weight="600">4</text><text x="318" y="270" font-size="16" fill="#c76b4a" text-anchor="start">加热：d 不变</text><text x="318" y="368" font-size="16" fill="#c76b4a" text-anchor="start">冷却到露点</text><text x="320" y="482" font-size="15" fill="#c76b4a" text-anchor="start">3→4：沿饱和线继续冷却，含湿量下降</text><text x="40" y="500" font-size="15" fill="#627681" text-anchor="start" font-weight="400">h = 1.005t + d(2501 + 1.86t)，d = 0.622 p_v /(p − p_v)。</text></g></svg>
