<svg xmlns="http://www.w3.org/2000/svg" width="720" height="955" viewBox="0 0 720 955" role="img" aria-labelledby="title desc"><title id="title">最优条纹频率标定流程</title><desc id="desc">白板采集、幅值提取、逐像素拟合、候选搜索、全局汇总与实测验收。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#82a59a"/></marker></defs><rect width="720" height="955" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="36" y="48" font-size="29" fill="#263f4b" font-weight="600">从采集到可用的推荐结果</text><text x="36" y="84" font-size="21" fill="#607680" font-weight="400">核心模型 + 工程检查；逐距离重复</text><rect x="36" y="116" width="648" height="94" rx="12" fill="#edf5f2" stroke="#c8d9d4"/><text x="58" y="153" font-size="26" fill="#263f4b" font-weight="600">01  固定设置并采集白板</text><text x="58" y="189" font-size="22" fill="#526b75" font-weight="400">多频率 × N 步相移；保持曝光与功率</text><path d="M360,212 L360,241" stroke="#82a59a" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="244" width="648" height="94" rx="12" fill="#f3f6f8" stroke="#c8d9d4"/><text x="58" y="281" font-size="26" fill="#263f4b" font-weight="600">02  提取 A、B 与 λ</text><text x="58" y="317" font-size="22" fill="#526b75" font-weight="400">背景校正；排除饱和与噪声底</text><path d="M360,340 L360,369" stroke="#82a59a" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="372" width="648" height="94" rx="12" fill="#edf5f2" stroke="#c8d9d4"/><text x="58" y="409" font-size="26" fill="#263f4b" font-weight="600">03  逐像素拟合响应</text><text x="58" y="445" font-size="22" fill="#526b75" font-weight="400">检查参数、残差与保留频率</text><path d="M360,468 L360,497" stroke="#82a59a" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="500" width="648" height="94" rx="12" fill="#f3f6f8" stroke="#c8d9d4"/><text x="58" y="537" font-size="26" fill="#263f4b" font-weight="600">04  在允许集合里搜索</text><text x="58" y="573" font-size="22" fill="#526b75" font-weight="400">计算 Q = fλ；约束采样和展开</text><path d="M360,596 L360,625" stroke="#82a59a" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="628" width="648" height="94" rx="12" fill="#edf5f2" stroke="#c8d9d4"/><text x="58" y="665" font-size="26" fill="#263f4b" font-weight="600">05  汇总工作空间结果</text><text x="58" y="701" font-size="22" fill="#526b75" font-weight="400">局部最优均值，或声明全局误差目标</text><path d="M360,724 L360,753" stroke="#82a59a" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="756" width="648" height="94" rx="12" fill="#f3f6f8" stroke="#c8d9d4"/><text x="58" y="793" font-size="26" fill="#263f4b" font-weight="600">06  实际重建验收</text><text x="58" y="829" font-size="22" fill="#526b75" font-weight="400">近优候选；重复性、参考偏差与覆盖率</text><text x="36" y="923" font-size="21" fill="#607680" font-weight="400">目标：给出适用条件和候选集合，不只输出一个数。</text></g></svg>