<svg xmlns="http://www.w3.org/2000/svg" width="780" height="625" viewBox="0 0 780 625" role="img" aria-labelledby="title desc"><title id="title">条纹测量的四个步骤</title><desc id="desc">先投影拍摄，求包裹相位，再确定周期编号，最后结合几何标定重建三维。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#74928a"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="32" y="42" font-size="27" fill="#243c48" text-anchor="start" font-weight="600">从光学编码到三维坐标</text><rect x="32" y="78" width="380" height="89" rx="12" fill="#eef5f3" stroke="#afc8be"/><text x="54" y="113" font-size="18" fill="#277e67" text-anchor="start" font-weight="400">01</text><text x="99" y="113" font-size="23" fill="#243c48" text-anchor="start" font-weight="600">投影与拍摄</text><text x="99" y="144" font-size="18" fill="#243c48" text-anchor="start" font-weight="400">光源线宽 · 条纹密度 · 曝光</text><path d="M222,167 L222,194" fill="none" stroke="#74928a" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="196" width="380" height="89" rx="12" fill="#eef5f3" stroke="#afc8be"/><text x="54" y="231" font-size="18" fill="#277e67" text-anchor="start" font-weight="400">02</text><text x="99" y="231" font-size="23" fill="#243c48" text-anchor="start" font-weight="600">求包裹相位</text><text x="99" y="262" font-size="18" fill="#243c48" text-anchor="start" font-weight="400">多步相移 / 学习型解相</text><path d="M222,285 L222,312" fill="none" stroke="#74928a" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="314" width="380" height="89" rx="12" fill="#eef5f3" stroke="#afc8be"/><text x="54" y="349" font-size="18" fill="#277e67" text-anchor="start" font-weight="400">03</text><text x="99" y="349" font-size="23" fill="#243c48" text-anchor="start" font-weight="600">相位展开</text><text x="99" y="380" font-size="18" fill="#243c48" text-anchor="start" font-weight="400">空间连续性 / 额外编码</text><path d="M222,403 L222,430" fill="none" stroke="#74928a" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="432" width="380" height="89" rx="12" fill="#eef5f3" stroke="#afc8be"/><text x="54" y="467" font-size="18" fill="#277e67" text-anchor="start" font-weight="400">04</text><text x="99" y="467" font-size="23" fill="#243c48" text-anchor="start" font-weight="600">几何重建</text><text x="99" y="498" font-size="18" fill="#243c48" text-anchor="start" font-weight="400">相机与投影器的标定关系</text><path d="M414,122 L451,122" fill="none" stroke="#74928a" stroke-width="2" marker-end="url(#arrow)"/><text x="470" y="114" font-size="21" fill="#243c48" text-anchor="start" font-weight="600">得到亮度 I</text><text x="470" y="145" font-size="18" fill="#243c48" text-anchor="start" font-weight="400">检查饱和与调制幅值</text><path d="M414,240 L451,240" fill="none" stroke="#74928a" stroke-width="2" marker-end="url(#arrow)"/><text x="470" y="232" font-size="21" fill="#243c48" text-anchor="start" font-weight="600">得到周期内位置</text><text x="470" y="263" font-size="18" fill="#243c48" text-anchor="start" font-weight="400">还不知道第几个周期</text><path d="M414,358 L451,358" fill="none" stroke="#74928a" stroke-width="2" marker-end="url(#arrow)"/><text x="470" y="350" font-size="21" fill="#243c48" text-anchor="start" font-weight="600">确定周期编号 k</text><text x="470" y="381" font-size="18" fill="#243c48" text-anchor="start" font-weight="400">孤立区域需注意歧义</text><path d="M414,476 L451,476" fill="none" stroke="#74928a" stroke-width="2" marker-end="url(#arrow)"/><text x="470" y="468" font-size="21" fill="#243c48" text-anchor="start" font-weight="600">得到 X、Y、Z</text><text x="470" y="499" font-size="18" fill="#243c48" text-anchor="start" font-weight="400">相位好不等于标定正确</text><text x="32" y="593" font-size="17" fill="#627681" text-anchor="start" font-weight="400">教学流程示意 · 不是光路图，也不表示完整三维只能用一张图。</text></g></svg>