<svg xmlns="http://www.w3.org/2000/svg" width="780" height="552" viewBox="0 0 780 552" role="img" aria-labelledby="title desc"><title id="title">U-Net 的多尺度特征融合</title><desc id="desc">左侧编码器下采样，中间为瓶颈，右侧解码器上采样，同尺度特征通过跳跃连接拼接。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#74928a"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="32" y="43" font-size="27" fill="#243c48" text-anchor="start" font-weight="600">U-Net：大范围信息与局部位置相遇</text><rect x="40" y="90" width="230" height="86" rx="12" fill="#eef5f3" stroke="#afc8be"/><text x="155.0" y="124" font-size="22" fill="#243c48" text-anchor="middle" font-weight="600">高分辨率特征</text><text x="155.0" y="154" font-size="18" fill="#243c48" text-anchor="middle" font-weight="400">保留局部边缘</text><rect x="92" y="237" width="230" height="86" rx="12" fill="#eef5f3" stroke="#afc8be"/><text x="207.0" y="271" font-size="22" fill="#243c48" text-anchor="middle" font-weight="600">较低分辨率特征</text><text x="207.0" y="301" font-size="18" fill="#243c48" text-anchor="middle" font-weight="400">扩大上下文范围</text><rect x="466" y="90" width="270" height="86" rx="12" fill="#eaf3f7" stroke="#afc8be"/><text x="601.0" y="124" font-size="22" fill="#243c48" text-anchor="middle" font-weight="600">密集预测</text><text x="601.0" y="154" font-size="18" fill="#243c48" text-anchor="middle" font-weight="400">融合细节与上下文</text><rect x="416" y="237" width="270" height="86" rx="12" fill="#eaf3f7" stroke="#afc8be"/><text x="551.0" y="271" font-size="22" fill="#243c48" text-anchor="middle" font-weight="600">恢复空间尺寸</text><text x="551.0" y="301" font-size="18" fill="#243c48" text-anchor="middle" font-weight="400">与同尺度特征拼接</text><rect x="250" y="384" width="280" height="86" rx="12" fill="#eef5f3" stroke="#afc8be"/><text x="390.0" y="418" font-size="22" fill="#243c48" text-anchor="middle" font-weight="600">瓶颈特征</text><text x="390.0" y="448" font-size="18" fill="#243c48" text-anchor="middle" font-weight="400">更大范围的信息</text><path d="M154,178 L202,234" fill="none" stroke="#74928a" stroke-width="2" marker-end="url(#arrow)"/><text x="53" y="208" font-size="17" fill="#243c48" text-anchor="start" font-weight="400">下采样</text><path d="M206,325 L328,382" fill="none" stroke="#74928a" stroke-width="2" marker-end="url(#arrow)"/><path d="M459,382 L548,325" fill="none" stroke="#74928a" stroke-width="2" marker-end="url(#arrow)"/><path d="M555,235 L598,178" fill="none" stroke="#74928a" stroke-width="2" marker-end="url(#arrow)"/><text x="641" y="212" font-size="17" fill="#243c48" text-anchor="start" font-weight="400">上采样</text><path d="M272,132 L461,132" fill="none" stroke="#74928a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="365" y="111" font-size="18" fill="#243c48" text-anchor="middle" font-weight="400">跳跃连接</text><path d="M324,279 L412,279" fill="none" stroke="#74928a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="367" y="253" font-size="17" fill="#243c48" text-anchor="middle" font-weight="400">拼接</text><text x="32" y="520" font-size="18" fill="#627681" text-anchor="start" font-weight="400">结构思想示意：省略具体层数、卷积参数和尺寸裁剪。</text></g></svg>